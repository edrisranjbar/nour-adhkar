name: Deploy

# Runs when develop is merged into main: deploys the Laravel API and the website.
# The server (Iran) cannot reach GitHub's download hosts, Packagist or npm reliably, so
# dependencies are built here and uploaded; the server only pulls code and runs deploy/deploy.sh.
on:
  push:
    branches: [main]
    paths: ["backend/**", "Nour Adhkar/**", "deploy/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      schedule_articles_only:
        description: "Import the approved private two-article batch without deploying application code"
        type: boolean
        default: false
      website_preflight_only:
        description: "Inspect website routing and deployment permissions without changing the server"
        type: boolean
        default: false
      progress_sync_only:
        description: "Deploy only Android progress sync without resetting the checkout"
        type: boolean
        default: false

concurrency: deploy

jobs:
  deploy:
    if: ${{ !inputs.progress_sync_only && !inputs.website_preflight_only && !inputs.schedule_articles_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, zip, pdo_mysql, bcmath, gd
          tools: composer

      - name: Build backend vendor
        working-directory: backend
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
          tar czf ../backend-vendor.tgz vendor

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package private website runtime
        run: tar czf website-runtime.tgz -C "$(dirname "$(command -v node)")" node

      - name: Build website
        working-directory: Nour Adhkar
        run: |
          node --test scripts/__tests__/refresh-articles.test.mjs
          npm install --no-audit --no-fund
          npm run build
          tar czf ../web-dist.tgz -C dist .

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          WEB_ROOT: ${{ vars.DEPLOY_WEB_ROOT }}
        run: |
          test -n "$APP_DIR" || { echo "::error::Set the DEPLOY_APP_DIR repository variable"; exit 1; }
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          scp -P "$SSH_PORT" backend-vendor.tgz web-dist.tgz "$SSH_USER@$SSH_HOST:$APP_DIR/../"
          LOCAL_NODE_SHA=$(sha256sum "$(command -v node)" | cut -d ' ' -f 1)
          REMOTE_NODE_SHA=$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "sha256sum '$APP_DIR/backend/storage/app/website/runtime/node' 2>/dev/null" | cut -d ' ' -f 1) || REMOTE_NODE_SHA=''
          if [ "$LOCAL_NODE_SHA" != "$REMOTE_NODE_SHA" ]; then
            scp -P "$SSH_PORT" website-runtime.tgz "$SSH_USER@$SSH_HOST:$APP_DIR/website-runtime.tgz"
          fi
          # Update the checkout first so the deploy script itself is always current.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' && git fetch --quiet origin ${{ github.sha }} && git reset --hard ${{ github.sha }} && APP_DIR='$APP_DIR' WEB_ROOT='$WEB_ROOT' bash deploy/deploy.sh ${{ github.sha }}"

      - name: Verify live articles and automatic refresh
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
        run: |
          node 'Nour Adhkar/scripts/verify-live-articles.mjs'
          node 'Nour Adhkar/scripts/verify-live-updates.mjs'
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -eu
          crontab -l | grep '# nour-adhkar-articles$'
          STATUS="$APP_DIR/backend/storage/app/website/articles.json.status"
          BEFORE=$(stat -c %Y "$STATUS")
          # Wait at most 90 seconds to observe a real cron tick, not only the deploy invocation.
          for attempt in $(seq 1 18); do
            sleep 5
            if [ "$(stat -c %Y "$STATUS")" -gt "$BEFORE" ]; then
              cat "$STATUS"
              echo 'Automatic article refresh heartbeat verified.'
              exit 0
            fi
          done
          echo 'Article refresh timer did not run within 90 seconds.' >&2
          exit 1
          REMOTE

  progress-sync:
    if: ${{ inputs.progress_sync_only && !inputs.website_preflight_only && !inputs.schedule_articles_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, zip, pdo_sqlite, bcmath
          tools: composer
      - name: Test progress sync
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          php artisan test --filter=ProgressSyncTest
      - name: Prepare scoped patch
        run: |
          git show --format= dc8490f -- backend/app/Http/Controllers/ProgressSyncController.php backend/database/migrations/2026_10_01_000000_create_app_progress_backups_table.php backend/routes/progress.php backend/routes/api.php > progress-sync.patch
          test -s progress-sync.patch
      - name: Deploy only progress sync
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
        run: |
          test -n "$APP_DIR"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          scp -P "$SSH_PORT" progress-sync.patch "$SSH_USER@$SSH_HOST:$APP_DIR/../progress-sync.patch"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$APP_DIR' && bash -s" <<'REMOTE'
          set -euo pipefail
          if git apply --reverse --check ../progress-sync.patch 2>/dev/null; then
            echo 'Progress sync patch already applied.'
          else
            git apply --check ../progress-sync.patch
            git apply ../progress-sync.patch
          fi
          cd backend
          php artisan migrate --force --path=database/migrations/2026_10_01_000000_create_app_progress_backups_table.php
          php artisan route:clear
          php artisan route:cache
          php artisan route:list --path=progress/sync
          FPM_SERVICE=$(systemctl list-units --type=service --all --no-legend | awk '/php[0-9.]+-fpm.service/ {print $1; exit}')
          if [ -n "$FPM_SERVICE" ]; then sudo -n systemctl reload "$FPM_SERVICE"; fi
          REMOTE
      - name: Verify authenticated endpoint is live
        run: |
          status=$(curl -sS -o /tmp/progress-response.json -w '%{http_code}' -X POST https://api.adhkar.ir/api/progress/sync -H 'Accept: application/json' -H 'Content-Type: application/json' --data '{"version":1,"records":[]}')
          test "$status" = 401

  website-preflight:
    if: ${{ inputs.website_preflight_only && !inputs.schedule_articles_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect website routing
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -eu
          id
          git -C "$APP_DIR" status --short
          df -h "$APP_DIR"
          sudo -n -l
          node --version
          command -v php
          command -v crontab
          command -v flock
          stat -c '%U %G %a %n' "$APP_DIR" "$APP_DIR/Nour Adhkar/dist" "$APP_DIR/backend/storage"
          readlink -f "$APP_DIR/NourAdhkar"
          stat -c '%U %G %a %n' "$APP_DIR/NourAdhkar"
          test -w "$APP_DIR/NourAdhkar"
          crontab -l || true
          grep -E 'server_name|listen |root |try_files|location ' /etc/nginx/sites-enabled/adhkar.ir
          REMOTE

  schedule-articles:
    if: ${{ inputs.schedule_articles_only && !inputs.website_preflight_only && !inputs.progress_sync_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite
          tools: composer
      - name: Test scheduling and public visibility
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --force
          php artisan jwt:secret --force >/dev/null
          php artisan test --filter='PostShowScheduleTest|ScheduledArticleBatchTest|PanelArticleScheduleTest'
      - name: Prepare approved private batch
        env:
          ARTICLE_BATCH: ${{ secrets.ARTICLE_BATCH_20261024 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          payload = base64.b64decode(os.environ['ARTICLE_BATCH'].strip(), validate=True)
          batch = json.loads(payload)
          assert len(batch['articles']) == 2
          pathlib.Path(os.environ['RUNNER_TEMP'], 'article-batch.json').write_bytes(payload)
          PY
      - name: Schedule and read back the articles
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          REMOTE_DIR="$APP_DIR/backend/storage/app/article-imports/$GITHUB_RUN_ID"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR' && chmod 700 '$REMOTE_DIR'"
          scp -P "$SSH_PORT" "$RUNNER_TEMP/article-batch.json" deploy/schedule-articles.php "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$APP_DIR/backend' && NOUR_BACKEND_ROOT='$APP_DIR/backend' php '$REMOTE_DIR/schedule-articles.php' '$REMOTE_DIR/article-batch.json'"
      - name: Verify articles are not public before their scheduled dates
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          batch = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'article-batch.json').read_text())
          slugs = {a['slug'] for a in batch['articles']}
          for endpoint in ('https://api.adhkar.ir/api/posts', 'https://api.adhkar.ir/api/app-articles'):
              data = json.load(urllib.request.urlopen(endpoint, timeout=20))['data']
              assert not slugs.intersection(a['slug'] for a in data)
          for slug in slugs:
              try:
                  urllib.request.urlopen('https://api.adhkar.ir/api/posts/' + slug, timeout=20)
              except urllib.error.HTTPError as error:
                  assert error.code == 404
              else:
                  raise AssertionError('Scheduled article is already public')
          print('Both articles are scheduled and hidden from public API lists and direct URLs.')
          PY
