name: Scheduled Instagram posts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: instagram-publishing
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/instagram-publisher
      - name: Publish due posts
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_PUBLISH_TOKEN: ${{ secrets.INSTAGRAM_PUBLISH_TOKEN }}
          INSTAGRAM_API_URL: ${{ vars.INSTAGRAM_API_URL || 'https://api.adhkar.ir/api' }}
          INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION || 'v25.0' }}
        run: |
          if [ -z "$INSTAGRAM_ACCOUNT_ID" ] || [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_PUBLISH_TOKEN" ]; then
            echo "Instagram account is not configured; nothing will be published."
            exit 0
          fi
          python3 tools/instagram-publisher/publish.py
