name: Website checks
on:
  push:
    branches: [develop]
    paths: ["Nour Adhkar/**", "backend/**", "deploy/**", ".github/workflows/website-tests.yml", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["Nour Adhkar/**", "backend/**", "deploy/**", ".github/workflows/website-tests.yml", ".github/workflows/deploy.yml"]
jobs:
  article-scheduling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite
          tools: composer
      - name: Test scheduling and direct article visibility
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --force
          php artisan test --filter='PostShowScheduleTest|ScheduledArticleBatchTest|PanelArticleScheduleTest'
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test article regeneration
        working-directory: Nour Adhkar
        run: node --test scripts/__tests__/refresh-articles.test.mjs
      - name: Check deployment scripts
        run: bash -n deploy/deploy.sh deploy/refresh-articles.sh deploy/install-article-timer.sh
      - name: Build website
        working-directory: Nour Adhkar
        run: |
          npm install --no-audit --no-fund
          npm run build
